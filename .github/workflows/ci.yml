name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: true
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz the decoders
        if: runner.os == 'Linux'
        run: go test -run XXX -fuzz FuzzDecoders -fuzztime 30s ./internal/protocol
      - name: Build receiver
        shell: bash
        run: |
          mkdir -p ../dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o ../dist/pocketpad$ext ./cmd/pocketpad
          go build -trimpath -ldflags "-s -w" -o ../dist/ppsim$ext ./cmd/ppsim
      - uses: actions/upload-artifact@v4
        with:
          name: pocketpad-${{ runner.os }}
          path: dist/

  android-protocol:
    name: Kotlin protocol (shared vectors)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew test --no-daemon

  android-app:
    name: Android app (build, tests, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list still asks for the legacy "tools"
          # package, which Google removed from the SDK repository; install the
          # rest explicitly below.
          packages: 'platform-tools'
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pocketpad-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
