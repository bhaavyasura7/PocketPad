name: CI

on:
  push:
  pull_request:

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache: false # no third-party dependencies
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Fuzz the decoders
        if: runner.os == 'Linux'
        run: go test -run XXX -fuzz FuzzDecoders -fuzztime 30s ./internal/protocol
      - name: Build receiver
        shell: bash
        run: |
          mkdir -p ../dist
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o ../dist/pocketpad$ext ./cmd/pocketpad
          go build -trimpath -ldflags "-s -w" -o ../dist/ppsim$ext ./cmd/ppsim
      - uses: actions/upload-artifact@v4
        with:
          name: pocketpad-${{ runner.os }}
          path: dist/
